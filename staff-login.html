<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login | CampusScan</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo">CampusScan<span class="dot">.</span></a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="student-login.html">Student Login</a>
  </div>
</nav>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-icon" style="background:var(--accent);">🧑‍💼</div>
    <h2>Staff Portal</h2>
    <p class="subtitle">Login to review and resolve student complaints</p>

    <div id="loginAlert" class="alert alert-error"></div>
    <form id="staffLoginForm">
      <div class="form-group">
        <label for="email">Staff Email</label>
        <input type="email" id="email" placeholder="staff@campus.edu" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="background:var(--accent);">Login</button>
    </form>
    <p class="form-footer-text">Demo login: ramesh.staff@campus.edu / password123</p>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
